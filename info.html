<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Info Jadwal Kuliah</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg,#00c6ff,#0072ff,#6a11cb,#2575fc);
            background-size: 400% 400%;
            animation: bg 10s ease infinite;
            overflow: hidden;
        }

        /* Background bergerak */
        @keyframes bg{
            0%{
                background-position: 0% 50%;
            }
            50%{
                background-position: 100% 50%;
            }
            100%{
                background-position: 0% 50%;
            }
        }

        .container{
            width: 85%;
            padding: 40px;
            border-radius: 25px;
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
            animation: muncul 1.5s ease;
        }

        @keyframes muncul{
            from{
                opacity: 0;
                transform: translateY(50px);
            }
            to{
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1{
            text-align: center;
            color: white;
            margin-bottom: 40px;
            font-size: 50px;
            animation: glow 2s infinite alternate;
        }

        @keyframes glow{
            from{
                text-shadow: 0 0 10px white;
            }
            to{
                text-shadow: 0 0 25px cyan;
            }
        }

        .card-container{
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
            gap: 25px;
        }

        .card{
            background: rgba(255,255,255,0.15);
            padding: 25px;
            border-radius: 20px;
            color: white;
            transition: 0.4s;
            position: relative;
            overflow: hidden;
        }

        .card::before{
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background: rgba(255,255,255,0.1);
            transform: rotate(45deg);
            top: -150%;
            left: -150%;
            transition: 0.6s;
        }

        .card:hover::before{
            top: -20%;
            left: -20%;
        }

        .card:hover{
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 0 25px cyan;
        }

        .card h2{
            margin-bottom: 15px;
            font-size: 28px;
        }

        .card p{
            margin: 8px 0;
            font-size: 18px;
        }

        .btn{
            display: block;
            width: 250px;
            margin: 40px auto 0;
            text-align: center;
            padding: 15px;
            border-radius: 15px;
            background: linear-gradient(to right,#00c6ff,#0072ff);
            color: white;
            text-decoration: none;
            font-size: 20px;
            transition: 0.4s;
        }

        .btn:hover{
            transform: scale(1.05);
            box-shadow: 0 0 20px cyan;
        }

        /* Bubble background */

        body::before,
        body::after{
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            animation: bubble 8s infinite alternate;
        }

        body::before{
            top: -100px;
            left: -100px;
        }

        body::after{
            bottom: -100px;
            right: -100px;
        }

        @keyframes bubble{
            from{
                transform: translateY(0px);
            }
            to{
                transform: translateY(50px);
            }
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Info Jadwal Kuliah</h1>

        <div class="card-container">

            <div class="card">
                <h2>Pemrograman Web</h2>
                <p>📅 Senin</p>
                <p>⏰ 08:50 - 10:30</p>
                <p>👨‍🏫 Pak Budi</p>
                <p>🏫 Lab 1</p>
            </div>

            <div class="card">
                <h2>Basis Data</h2>
                <p>📅 Selasa</p>
                <p>⏰ 07:10 - 08:50</p>
                <p>👩‍🏫 Bu Sinta</p>
                <p>🏫 R203</p>
            </div>

            <div class="card">
                <h2>Jaringan Komputer</h2>
                <p>📅 Rabu</p>
                <p>⏰ 10:30 - 12:10</p>
                <p>👨‍🏫 Pak Andi</p>
                <p>🏫 R105</p>
            </div>

        </div>

        <a href="index.html" class="btn">
            ⬅ Kembali
        </a>

    </div>

</body>
</html>
